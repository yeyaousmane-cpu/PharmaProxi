name: Installer PharmaProxi
on:
  push:
    paths: ['pharmaproxi-code.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer le contenu par le code complet
        run: |
          set -e
          mkdir /tmp/code
          unzip -q pharmaproxi-code.zip -d /tmp/code
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/code/. .
          git config user.name "PharmaProxi installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Installation PharmaProxi v0.3 (structure complete)"
          git push
