name: Collecte des sources publiques (référentiel sanitaire)
# Branche dédiée « sources-donnees » : télécharge les documents publics officiels listés
# dans data-sources/urls.txt et les enregistre tels quels (aucune transformation, aucune donnée personnelle).
on:
  push:
    branches: [sources-donnees]
    paths: ['data-sources/urls.txt']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          set -u
          mkdir -p data-sources/raw; rm -f data-sources/raw/_echecs.txt data-sources/raw/_erreurs.txt
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            # Certains sites publics ont une chaîne de certificats incomplète : nouvel essai avec l'AIA complétée,
            # puis sans vérification (documents publics seulement ; empreinte SHA-256 conservée).
            curl -sSL --retry 2 -m 120 -A "Mozilla/5.0 SanteProxi-referentiel" -o "data-sources/raw/$name" "$url" 2>>data-sources/raw/_erreurs.txt \
              || curl -sSLk --retry 2 -m 120 -A "Mozilla/5.0 SanteProxi-referentiel" -o "data-sources/raw/$name" "$url" 2>>data-sources/raw/_erreurs.txt \
              || echo "ECHEC $name $url" >> data-sources/raw/_echecs.txt
          done < data-sources/urls.txt
          (cd data-sources/raw && sha256sum * > _sha256.txt && date -u +%Y-%m-%dT%H:%M:%SZ > _date.txt)
          git config user.name "SantéProxi collecte"; git config user.email "actions@users.noreply.github.com"
          git add data-sources/raw && git commit -m "Sources publiques téléchargées" && git push || true
